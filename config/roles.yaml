# What an ingredient does in a dish. Used to explain a substitution and to predict its
# effects. These are general cooking knowledge, not dataset facts, so every effect built
# from this file is labelled as a prediction.
#   baked: roles in baked goods (the recipe mentions baking or an oven)
#   other: roles in everything else

ingredients:
  egg:
    baked: [binding, leavening, moisture, structure, emulsification]
    other: [binding, richness, emulsification]
  egg yolk:
    baked: [richness, moisture]
    other: [richness, thickening]
  egg white:
    baked: [leavening, structure]
    other: [binding]
  cream:
    baked: [fat, moisture]
    other: [fat, richness, thickening]
  milk:
    baked: [moisture, tenderness]
    other: [moisture, richness]
  butter:
    baked: [fat, tenderness, flavor]
    other: [fat, flavor]
  sour cream:
    baked: [moisture, fat, tang]
    other: [richness, tang]
  yogurt:
    baked: [moisture, tang]
    other: [richness, tang]
  cream cheese:
    baked: [fat, structure]
    other: [richness, thickening]
  parmesan:
    other: [flavor, saltiness]
  cheese:
    other: [flavor, richness, binding]
  flour:
    baked: [structure]
    other: [thickening]
  sugar:
    baked: [sweetness, moisture, browning]
    other: [sweetness]
  vegetable oil:
    baked: [fat, moisture]
    other: [fat]
  peanut butter:
    other: [flavor, richness, binding]

role_effects:
  binding: may hold together less well and be more crumbly
  leavening: may rise less and be denser
  moisture: may be drier
  fat: may be less rich and less tender
  richness: may taste lighter and less rich
  thickening: may be thinner; simmering a little longer can help
  flavor: may taste different
  tenderness: may be firmer or tougher
  structure: may be more fragile and softer
  emulsification: may be less smooth, as the batter can separate
  tang: may taste less tangy
  sweetness: may taste less sweet
  browning: may brown less
  saltiness: may need a little more salt

# How each role shows in the finished dish (the "property" column of texture predictions).
role_property:
  binding: Binding
  leavening: Rise
  moisture: Moisture
  structure: Structure
  emulsification: Batter consistency
  fat: Richness and tenderness
  richness: Richness
  thickening: Thickness
  tenderness: Tenderness
  flavor: Flavor
  tang: Tang
  sweetness: Sweetness
  browning: Browning
  saltiness: Saltiness

# What common substitutes can provide, fully. A candidate that provides the target's main
# role (its first role above) is a good fit; one that provides only other roles, or the
# main role only partly, is a partial fit; one with no overlap is a poor fit. Candidates
# not listed here are "unknown fit". Ingredients that also count as wet ingredients in the
# moisture check are the ones that provide moisture.
provides:
  applesauce: [moisture, sweetness]
  banana: [moisture, sweetness]
  pumpkin puree: [moisture]
  yogurt: [moisture, tang, richness]
  greek yogurt: [moisture, tang, richness]
  silken tofu: [binding, moisture, richness, thickening]
  soy yogurt: [moisture, tang]
  egg replacer: [binding, leavening]
  milk: [moisture, richness]
  sour cream: [moisture, fat, tang]
  cream: [fat, moisture, richness]
  tofu: [binding, structure]
  flaxseed: [binding]
  ground flaxseed: [binding]
  chia seed: [binding]
  baking powder: [leavening]
  baking soda: [leavening]
  buttermilk: [moisture, tang, tenderness]
  egg substitute: [binding, leavening, moisture, structure, emulsification]
  coconut milk: [fat, richness, moisture, thickening]
  unsweetened coconut milk: [fat, richness, moisture, thickening]
  coconut cream: [fat, richness, thickening]
  cashew: [richness, thickening]
  almond milk: [moisture]
  soy milk: [moisture, richness]
  rice milk: [moisture]
  oat milk: [moisture, richness]
  evaporated milk: [richness, moisture]
  half-and-half: [fat, richness, moisture]
  olive oil: [fat, moisture, flavor]
  vegetable oil: [fat, moisture]
  oil: [fat, moisture]
  canola oil: [fat, moisture]
  coconut oil: [fat, tenderness]
  shortening: [fat, tenderness, structure]
  vegetable shortening: [fat, tenderness, structure]
  margarine: [fat, tenderness, flavor]
  cornstarch: [thickening]
  flour: [thickening, structure]
  stock: [moisture, flavor]
  chicken broth: [moisture, flavor]
  vegetable broth: [moisture, flavor]
  water: [moisture]
  cooking spray: [greasing]
  honey: [sweetness, moisture]
  maple syrup: [sweetness, moisture]

# Roles a substitute provides only in part: applesauce holds a batter together a little,
# but much less than egg does. Shown as "partly" and never as a full replacement.
partially_provides:
  applesauce: [binding]
  banana: [binding]
  pumpkin puree: [binding]
  yogurt: [binding]
  greek yogurt: [binding]
  soy yogurt: [binding]
  silken tofu: [structure, emulsification]
  egg replacer: [structure]
  flaxseed: [moisture]
  ground flaxseed: [moisture]
  chia seed: [moisture]
  buttermilk: [leavening]

# Uses of an ingredient that are not part of the dish itself. "Beaten egg or milk, for
# brushing" says nothing about replacing the egg in a batter, so such "X or Y" lines are
# only evidence when the target line is used the same way.
surface_uses: [brush, brushing, wash, glaze, glazing, dusting, garnish, sprinkling, greasing]

# Quantities found in a related recipe are scaled to this recipe by a shared ingredient,
# one of these (the bulk of the dish). Without one, the quantity is not scaled.
scale_anchors: [flour, pasta, rice]

# Herbs and spices only add flavor; they are never a fit for fat, binding or thickening.
flavor_only: [
  basil, rosemary, mint, sage, thyme, oregano, parsley, cilantro, dill, chive, tarragon,
  bay leaf, garlic, black pepper, salt, cumin, paprika, cinnamon, nutmeg, ginger, clove,
  vanilla extract, lemon zest, orange zest, red pepper flake, cayenne pepper, allspice
]

# Parsed "ingredient" names that are not ingredients; never suggested as substitutes.
ignore_candidates: [liquid, mixture, filling, topping, garnish, glaze, sauce, dough, batter, crust]

# A recipe counts as baked if its instructions contain one of these words.
baked_markers: [bake, baked, baking, oven, preheat]

  black pepper: [ground black pepper, cracked black pepper, coarsely ground black pepper]
  carrot: [baby carrot]
  mushroom: [button mushroom, white mushroom, cremini mushroom, baby bella mushroom]
  lemon: [meyer lemon]
  parsley: [flat-leaf parsley, italian parsley, flat leaf parsley, curly parsley, parsley leaf, flat-leaf parsley leaf, italian parsley leaf]
  basil: [basil leaf, sweet basil]
  mint: [mint leaf, spearmint leaf]
  cilantro: [cilantro leaf, cilantro leaves with tender stem]
  sage: [sage leaf]
  thyme: [thyme leaf, thyme sprig]
  oregano: [oregano leaf]

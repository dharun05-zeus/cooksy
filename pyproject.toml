[project]
name = "recipebot"
version = "0.1.0"
description = "Evidence-grounded recipe assistant over the Recipe Box dataset"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "inflect>=7.3",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.0",
    "bm25s>=0.3.16",
    "google-genai>=3.0.0",
    "tenacity>=9.1.4",
    "typer>=0.28.0",
    "rich>=15.0.0",
    "ollama>=0.6.3",
    "httpx>=0.27",
    "streamlit>=1.67.0",
]

[project.scripts]
recipebot = "recipebot.ui.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # test-case tables read better on one line
"src/recipebot/llm/parser.py" = ["E501"]  # one prompt example per line

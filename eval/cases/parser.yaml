# Labelled user messages for the message parser (LLM + guards, or fallback).
# `state` sets the conversation context before the message:
#   task: search | match      last_results: number of results on screen
# `expect` lists only the fields that matter for the case; other fields are not checked.
#   exclude: compared as categories when the word is a category ("nuts" = peanut + tree nut)
#   query_has: words the search query must contain
# Many phrasings deliberately differ from the examples in the parser prompt.

- message: Find a penne pasta recipe.
  expect: {intent: search, query_has: [penne]}
- message: I cannot have dairy.
  state: {task: search, last_results: 5}
  expect: {intent: search, exclude: [dairy]}
- message: no nuts please
  state: {task: search, last_results: 5}
  expect: {intent: search, exclude: [nuts]}
- message: show me some vegan curry recipes
  expect: {intent: search, query_has: [curry], exclude: [vegan]}
- message: I'm allergic to shellfish, find me a paella
  expect: {intent: search, query_has: [paella], exclude: [shellfish]}
- message: gluten free brownies
  expect: {intent: search, query_has: [brownie], exclude: [gluten]}
- message: chicken soup without onions
  expect: {intent: search, query_has: [soup], exclude: [onion]}
- message: something with salmon and asparagus
  expect: {intent: search, query_has: [salmon]}
- message: show me the third one
  state: {task: search, last_results: 5}
  expect: {intent: detail, result_number: 3}
- message: what are the instructions for the first recipe?
  state: {task: search, last_results: 5}
  expect: {intent: detail, result_number: 1}
- message: How many recipes use cilantro?
  expect: {intent: stats, stats_operation: count, stats_include: [cilantro]}
- message: What percentage of recipes contain butter?
  expect: {intent: stats, stats_operation: percentage, stats_include: [butter]}
- message: How many recipes contain both garlic and onion? What percentage of the dataset is that?
  expect: {intent: stats, stats_operation: percentage, stats_include: [garlic, onion]}
- message: Among recipes containing tomato, which five have the fewest instruction steps?
  expect: {intent: stats, stats_operation: rank_by_steps, stats_include: [tomato], k: 5, order: fewest}
- message: Which 3 chicken recipes have the most steps?
  expect: {intent: stats, stats_operation: rank_by_steps, k: 3, order: most}
- message: What are the most common ingredients in cookie recipes?
  expect: {intent: stats, stats_operation: top_ingredients}
- message: What is the average number of ingredients in soup recipes?
  expect: {intent: stats, stats_operation: ingredient_count_stats}
- message: median ingredient count across the whole dataset
  expect: {intent: stats, stats_operation: ingredient_count_stats}
- message: How many vegetarian recipes are there?
  expect: {intent: stats, stats_operation: count}
- message: how many recipes are in the dataset?
  expect: {intent: stats, stats_operation: count}
- message: which ingredient appears most often?
  expect: {intent: stats, stats_operation: top_ingredients}
- message: I have eggs, onions, tomatoes, and rice. Suggest five recipes using as many of these as possible, with no peanuts and at most six instruction steps. Prefer recipes that need the fewest additional ingredients.
  expect: {intent: match, pantry: [egg, onion, tomato, rice], exclude: [peanut], max_steps: 6, limit: 5, preferences: []}
- message: Exclude eggs too.
  state: {task: match, last_results: 5}
  expect: {intent: match, exclude: [egg]}
- message: I've got chicken, broccoli and soy sauce, what can I make?
  expect: {intent: match, pantry: [chicken, broccoli, soy sauce]}
- message: I have 2 cups of rice and 4 eggs
  expect: {intent: match, pantry: [rice, egg]}
- message: only show recipes with at most 4 steps
  state: {task: match, last_results: 5}
  expect: {intent: match, max_steps: 4}
- message: Take this banana bread recipe and remove eggs.
  expect: {intent: substitute, substitute_target: egg, recipe_query_has: [banana]}
- message: Replace the cream in the first one without dairy.
  state: {task: search, last_results: 5}
  expect: {intent: substitute, substitute_target: cream, result_number: 1, exclude: [dairy]}
- message: can I make the second one without butter?
  state: {task: search, last_results: 5}
  expect: {intent: substitute, substitute_target: butter, result_number: 2}
- message: swap the sour cream for yogurt in the first recipe
  state: {task: search, last_results: 5}
  expect: {intent: substitute, substitute_target: sour cream, result_number: 1}
- message: what's the weather today?
  expect: {intent: clarify}
- message: start over
  expect: {intent: reset}
- message: dairy is fine now
  state: {task: search, last_results: 5, exclude: [dairy]}
  expect: {intent: search, remove_exclude: [dairy]}
- message: quick vegetarian dinner with chickpeas
  expect: {intent: search, query_has: [chickpea], exclude: [vegetarian], max_steps: null}
- message: lasagna for someone who is lactose intolerant
  expect: {intent: search, query_has: [lasagna], exclude: [dairy]}
- message: Find five easy cookie recipes
  expect: {intent: search, query_has: [cookie], limit: 5, max_steps: null}
- message: Find a pasta recipe with heavy cream.
  expect: {intent: search, query_has: [pasta], exclude: []}
- message: soups I can make in under 5 steps
  expect: {intent: search, query_has: [soup], max_steps: 4}
# The orchestrator answers questions about unrecorded attributes (calories, cooking time)
# with a fixed refusal whatever the intent, so any of these intents is acceptable here;
# the refusal itself is checked in conversations.yaml.
- message: How many calories are in the first recipe?
  state: {task: search, last_results: 5}
  expect: {intent_in: [detail, clarify, stats]}
- message: find tacos, but nothing with pork
  expect: {intent: search, query_has: [taco], exclude: [pork]}

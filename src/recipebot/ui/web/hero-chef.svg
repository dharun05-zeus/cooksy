<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" role="img" aria-label="A smiling chef holding a wooden spoon and a plate of penne">
<style>
  .steam path { animation: rise 3.4s ease-in-out infinite; }
  .steam path:nth-child(2) { animation-delay: .9s; }
  .sparkle { animation: twinkle 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .sparkle:nth-of-type(2) { animation-delay: .8s; }
  .sparkle:nth-of-type(3) { animation-delay: 1.6s; }
  .spoon { animation: stir 4s ease-in-out infinite; transform-origin: 338px 200px; }
  @keyframes rise { 0%, 100% { opacity: .1; transform: translateY(5px); } 50% { opacity: .6; transform: translateY(-5px); } }
  @keyframes twinkle { 0%, 100% { opacity: .35; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.1); } }
  @keyframes stir { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-7deg); } }
  @media (prefers-reduced-motion: reduce) { .steam path, .sparkle, .spoon { animation: none; } }
</style>
<defs>
  <radialGradient id="glow" cx="50%" cy="55%" r="55%">
    <stop offset="0" stop-color="#ff8a3d" stop-opacity=".42"/>
    <stop offset=".6" stop-color="#a855f7" stop-opacity=".14"/>
    <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="skin" cx="45%" cy="40%" r="65%">
    <stop offset="0" stop-color="#ffd9bd"/>
    <stop offset=".7" stop-color="#f4b48c"/>
    <stop offset="1" stop-color="#d98d63"/>
  </radialGradient>
  <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".6" stop-color="#f1ecf9"/>
    <stop offset="1" stop-color="#cfc3e6"/>
  </linearGradient>
  <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#e3dcef"/>
  </linearGradient>
  <linearGradient id="apron" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a26bfa"/>
    <stop offset="1" stop-color="#5b21b6"/>
  </linearGradient>
  <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fdba74"/>
    <stop offset="1" stop-color="#ea580c"/>
  </linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e3a86b"/>
    <stop offset="1" stop-color="#a8632c"/>
  </linearGradient>
  <linearGradient id="penne" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffd9a0"/>
    <stop offset=".4" stop-color="#f0602a"/>
    <stop offset="1" stop-color="#9a2a0c"/>
  </linearGradient>
  <radialGradient id="tomato" cx="35%" cy="30%" r="75%">
    <stop offset="0" stop-color="#ff9b8a"/>
    <stop offset=".35" stop-color="#f03a24"/>
    <stop offset=".85" stop-color="#a91a0c"/>
    <stop offset="1" stop-color="#6e0f06"/>
  </radialGradient>
  <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7ee07f"/>
    <stop offset=".5" stop-color="#2fa84a"/>
    <stop offset="1" stop-color="#14672a"/>
  </linearGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
  <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1a0b2e" flood-opacity=".45"/>
  </filter>
  <g id="pen">
    <path d="M-21 -7.5 L15 -7.5 L22 7.5 L-14 7.5 Z" fill="url(#penne)"/>
    <path d="M-19 -4 L16.6 -4 M-17.5 -.5 L18.2 -.5 M-16 3 L19.8 3" stroke="#7c1d08" stroke-opacity=".35" stroke-width="1.1"/>
    <ellipse cx="-4" cy="-4.5" rx="7" ry="1.6" fill="#fff" opacity=".5"/>
    <ellipse cx="18.5" cy="0" rx="3.6" ry="7.6" transform="rotate(-25 18.5 0)" fill="#5c1405" stroke="#ff9466" stroke-width="1.3"/>
  </g>
  <g id="tom">
    <circle r="12" fill="url(#tomato)"/>
    <ellipse cx="-4" cy="-5" rx="3.6" ry="2.2" fill="#fff" opacity=".7" transform="rotate(-30 -4 -5)"/>
    <path d="M0 -12 l2.5 -3.5 M0 -12 l-3.5 -2 M0 -12 l4 -.8 M0 -12 l-1 4 M0 -12 l-4 1.5" stroke="#2e7d32" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <g id="basil">
    <path d="M0 0 C10 -16 38 -18 50 -2 C38 12 12 14 0 0 Z" fill="url(#leaf)"/>
    <path d="M2 0 C18 -4 34 -4 48 -2" fill="none" stroke="#0d4f1f" stroke-width="1.4" stroke-opacity=".7"/>
    <path d="M14 -2 l6 -7 M24 -3 l6 -7 M34 -3 l5 -6 M16 -1 l6 6 M27 -2 l6 6" stroke="#0d4f1f" stroke-width=".9" stroke-opacity=".45" fill="none"/>
  </g>
  <path id="star" d="M0 -9 C1.5 -2 2 -1.5 9 0 C2 1.5 1.5 2 0 9 C-1.5 2 -2 1.5 -9 0 C-2 -1.5 -1.5 -2 0 -9 Z" fill="#ffd27a"/>
</defs>

<!-- light and floor -->
<ellipse cx="210" cy="190" rx="205" ry="150" fill="url(#glow)"/>
<ellipse cx="210" cy="318" rx="140" ry="12" fill="#000" opacity=".45" filter="url(#soft)"/>

<!-- floating garnish -->
<use href="#basil" transform="translate(42 70) rotate(24) scale(.75)"/>
<use href="#basil" transform="translate(360 52) rotate(-28) scale(.8)"/>
<use href="#tom" transform="translate(392 286) scale(1.15)" filter="url(#drop)"/>
<use class="sparkle" href="#star" transform="translate(132 62)"/>
<use class="sparkle" href="#star" transform="translate(300 96) scale(.8)"/>
<use class="sparkle" href="#star" transform="translate(64 168) scale(.7)"/>

<g filter="url(#drop)">
  <!-- jacket -->
  <path d="M112 330 C112 262 146 224 192 208 L228 208 C274 224 308 262 308 330 Z" fill="url(#white)"/>
  <path d="M262 226 C288 244 304 272 308 330 L270 330 C272 288 268 252 262 226 Z" fill="#b9acd6" opacity=".35"/>
  <!-- collar -->
  <path d="M190 208 L210 236 L200 246 L180 216 Z" fill="#ffffff" stroke="#ddd3ee" stroke-width="1.5"/>
  <path d="M230 208 L210 236 L220 246 L240 216 Z" fill="#ffffff" stroke="#ddd3ee" stroke-width="1.5"/>
  <!-- buttons -->
  <g fill="#c5b8e2">
    <circle cx="194" cy="258" r="4"/><circle cx="226" cy="258" r="4"/>
    <circle cx="194" cy="280" r="4"/><circle cx="226" cy="280" r="4"/>
  </g>
  <!-- apron -->
  <path d="M158 330 L164 290 Q210 280 256 290 L262 330 Z" fill="url(#apron)"/>
  <path d="M164 290 Q210 280 256 290" fill="none" stroke="#c4a3ff" stroke-width="2.5"/>
  <rect x="194" y="300" width="32" height="20" rx="5" fill="#7c3aed" stroke="#c4a3ff" stroke-width="1.5"/>

  <!-- neck and scarf -->
  <rect x="198" y="186" width="24" height="26" rx="8" fill="#e9a57c"/>
  <path d="M182 204 Q210 220 238 204 L226 222 Q210 230 194 222 Z" fill="url(#scarf)"/>
  <path d="M204 220 L196 246 L210 238 L224 246 L216 220 Z" fill="#f97316"/>
  <circle cx="210" cy="222" r="7" fill="#fb923c"/>

  <!-- ears, head -->
  <circle cx="166" cy="158" r="10" fill="#efae86"/>
  <circle cx="254" cy="158" r="10" fill="#efae86"/>
  <circle cx="210" cy="152" r="46" fill="url(#skin)"/>
  <!-- hair under the hat -->
  <path d="M166 132 C164 112 178 104 190 108 L184 140 C176 136 170 136 166 132 Z" fill="#5a3825"/>
  <path d="M254 132 C256 112 242 104 230 108 L236 140 C244 136 250 136 254 132 Z" fill="#5a3825"/>
  <!-- face -->
  <path d="M184 136 q9 -6 18 -1" fill="none" stroke="#5a3825" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M218 135 q9 -5 18 1" fill="none" stroke="#5a3825" stroke-width="3.2" stroke-linecap="round"/>
  <ellipse cx="193" cy="150" rx="5" ry="6.5" fill="#2b1d3a"/>
  <ellipse cx="227" cy="150" rx="5" ry="6.5" fill="#2b1d3a"/>
  <circle cx="195" cy="147.5" r="1.9" fill="#fff"/>
  <circle cx="229" cy="147.5" r="1.9" fill="#fff"/>
  <ellipse cx="181" cy="166" rx="8" ry="5" fill="#ff7a7a" opacity=".45"/>
  <ellipse cx="239" cy="166" rx="8" ry="5" fill="#ff7a7a" opacity=".45"/>
  <path d="M206 156 q4 8 8 0" fill="none" stroke="#c97b56" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M194 170 q16 18 32 0 q-16 5 -32 0 Z" fill="#7a1f2b"/>
  <path d="M202 178 q8 5 16 0 q-8 -3 -16 0 Z" fill="#ff6b81"/>

  <!-- chef's hat -->
  <g>
    <circle cx="182" cy="82" r="25" fill="url(#hat)"/>
    <circle cx="238" cy="82" r="25" fill="url(#hat)"/>
    <circle cx="210" cy="64" r="32" fill="url(#hat)"/>
    <circle cx="196" cy="92" r="22" fill="url(#hat)"/>
    <circle cx="224" cy="92" r="22" fill="url(#hat)"/>
    <rect x="168" y="94" width="84" height="24" rx="6" fill="#ffffff" stroke="#dcd3ec" stroke-width="1.5"/>
    <path d="M176 102 H244" stroke="#efe9f8" stroke-width="3" stroke-linecap="round"/>
    <path d="M192 52 q10 -8 22 -6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".9"/>
  </g>

  <!-- arm with the wooden spoon -->
  <g class="spoon">
    <path d="M356 108 L340 194" stroke="url(#wood)" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="359" cy="96" rx="12" ry="17" transform="rotate(12 359 96)" fill="url(#wood)"/>
    <ellipse cx="358" cy="94" rx="7" ry="11" transform="rotate(12 358 94)" fill="#f0c48f" opacity=".7"/>
  </g>
  <path d="M262 232 C286 222 308 208 324 188 L348 202 C334 230 306 254 280 266 Z" fill="url(#white)"/>
  <circle cx="338" cy="196" r="13" fill="url(#skin)"/>
  <path d="M330 188 q6 -6 14 -2" fill="none" stroke="#d98d63" stroke-width="2" stroke-linecap="round"/>

  <!-- arm with the plate -->
  <path d="M158 234 C138 246 120 250 100 246 L96 272 C122 276 148 272 168 262 Z" fill="url(#white)"/>
  <circle cx="96" cy="258" r="13" fill="url(#skin)"/>
</g>

<!-- the plate of penne -->
<g filter="url(#drop)">
  <ellipse cx="88" cy="244" rx="60" ry="15" fill="#f4f0fb"/>
  <ellipse cx="88" cy="242" rx="48" ry="10" fill="#e3dcef"/>
  <ellipse cx="88" cy="242" rx="38" ry="7" fill="#b3200f"/>
  <use href="#pen" transform="translate(64 236) rotate(-24) scale(.62)"/>
  <use href="#pen" transform="translate(84 238) rotate(18) scale(.62)"/>
  <use href="#pen" transform="translate(106 236) rotate(-38) scale(.62)"/>
  <use href="#pen" transform="translate(74 226) rotate(40) scale(.62)"/>
  <use href="#pen" transform="translate(98 224) rotate(-10) scale(.62)"/>
  <use href="#pen" transform="translate(86 214) rotate(28) scale(.62)"/>
  <use href="#tom" transform="translate(112 228) scale(.55)"/>
  <use href="#basil" transform="translate(76 210) rotate(-30) scale(.42)"/>
  <use href="#basil" transform="translate(88 212) rotate(-140) scale(.38)"/>
  <path d="M30 246 q58 16 116 0" fill="none" stroke="#fff" stroke-width="2.5" opacity=".9"/>
</g>
<g class="steam" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" filter="url(#blur)" opacity=".55">
  <path d="M74 196 c-10 -10 10 -18 0 -32"/>
  <path d="M102 194 c-10 -10 10 -18 0 -32"/>
</g>
</svg>
